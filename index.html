<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <label for="imie">Imię: </label>
      <input
        type="text"
        id="imie"
        placeholder="wpisz imię i nazwisko"
        required
      /><br /><br />
      <label for="email">Email: </label>
      <input
        type="email"
        id="email"
        name="imie"
        placeholder="wpisz email"
        required
      /><br /><br />
      <label for="password">Hasło: </label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="wpisz hasło"
        required
      /><br /><br />

      <label for="date">Data urodzenia:</label>
      <input type="date" id="date" name="date" required>
      <p>Wybierz status:</p>
      <input type="radio" id="uczen" name="status" value="uczen" required />
      <label for="uczen">Uczeń</label>
      <input type="radio" id="student" name="status" value="student" />
      <label for="student">Student</label>
      <input type="radio" id="dorosly" name="status" value="dorosly" />
      <label for="dorosly">Dorosły</label>
      <br /><br />
      <label for="city-select">Wybierz miasto wojewódzkie:</label>
      <select id="city-select" name="city">
        <option value="" disabled selected>Wybierz miasto z listy</option>
        <option value="warszawa">Warszawa</option>
        <option value="krakow">Kraków</option>
        <option value="wroclaw">Wrocław</option>
        <option value="poznan">Poznań</option>
        <option value="gdansk">Gdańsk</option>
      </select>
      <br /><br />
      <label for="uwagi">Dodatkowe uwagi:</label><br />
      <textarea
        id="uwagi"
        name="uwagi"
        rows="4"
        cols="40"
        placeholder="Wpisz dodatkowe informacje..."
      ></textarea>
      <br /><br />
      <label for="regulamin">
        <input type="checkbox" id="regulamin" name="regulamin" required />
        Akceptuję regulamin wydarzenia
      </label>
      <br /><br />
      <input type="submit" />
      <input type="reset" />
      <button
        type="button"
        onclick="alert('Wypełnij formularz i sprawdź dane przed wysłaniem.')"
      >
        Pomoc
      </button>
    </form>
  </body>
</html>
